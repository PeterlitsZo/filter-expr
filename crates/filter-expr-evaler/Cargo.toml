[package]
name = "filter-expr-evaler"
description = "Evaluator for filter expressions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/filter-expr"

[dependencies]
filter-expr = { path = "../filter-expr", version = "0.5.0" }

async-trait.workspace = true
thiserror.workspace = true
regex = "1.13.1"
anyhow = "1.0.104"
jiff = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
moka = { version = "0.12.16", features = ["sync"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
lru = { version = "0.18.5", default-features = false }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }

[features]
js = ["jiff/js"]
bench-internals = []

[[bench]]
name = "stages"
harness = false
required-features = ["bench-internals"]
